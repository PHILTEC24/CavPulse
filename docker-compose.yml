version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cavpulse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cavpulse
      POSTGRES_PASSWORD: cavpulse_secret
      POSTGRES_DB: cavpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cavpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cavpulse_redis
    restart: unless-stopped
    command: redis-server --requirepass cavpulse_redis_secret
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Uncomment for local mail testing
  # mailhog:
  #   image: mailhog/mailhog:latest
  #   container_name: cavpulse_mail
  #   ports:
  #     - "1025:1025"   # SMTP
  #     - "8025:8025"   # Web UI

volumes:
  postgres_data:
  redis_data:

